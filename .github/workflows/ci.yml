name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  solana:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust and Solana toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.local/share/solana
            ~/.avm
            solana/target
          key: solana-${{ hashFiles('solana/Cargo.toml', 'solana/Cargo.lock', 'solana/programs/**/Cargo.toml') }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install 0.31.3
          avm use 0.31.3
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Build and test
        run: |
          set +e
          bash scripts/build.sh > /tmp/build.log 2>&1
          status=$?
          cat /tmp/build.log
          if [ "$status" -ne 0 ]; then
            {
              echo "solana: $(solana --version 2>&1)"
              echo "cargo-build-sbf: $(command -v cargo-build-sbf || echo missing)"
              echo "anchor: $(command -v anchor-0.31.3 anchor || echo missing)"
              echo "PATH=$PATH"
            } | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 12 /tmp/build.log | sed 's/\r$//' | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit "$status"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install app dependencies
        working-directory: .
        run: npm ci

      - name: Program integration suite
        run: |
          set +e
          bash scripts/test.sh > /tmp/suite.log 2>&1
          status=$?
          cat /tmp/suite.log
          if [ "$status" -ne 0 ]; then
            {
              echo "solana: $(solana --version 2>&1)"
              echo "validator: $(solana-test-validator --version 2>&1 | head -1)"
            } | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 20 /tmp/suite.log | sed 's/\r$//' | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            echo "--- validator log"
            tail -n 40 /tmp/vesper-validator.log 2>/dev/null | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit "$status"
          fi

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install
        run: npm ci

      - name: Compile and typecheck
        run: npx hardhat build && npx tsc --noEmit

      - name: Test
        run: npm test
